name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 1. Acceptation non-interactive des licences Android SDK
    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        printf "243337023502608728d1238450e34161d6b7c08f\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c05b40f59d77d92e145b240a4696ec77\n7855a9a97d89980d2822077142b6006b00f5a03a\n" > $ANDROID_HOME/licenses/android-sdk-license

    # 2. Installation des dépendances JavaScript & Capacitor
    - name: Install Dependencies
      run: |
        bun install
        bun add @capacitor/core @capacitor/cli @capacitor/android

    # 3. Build de l'application Web (Vite)
    - name: Build Web App
      run: bun run build

    # 4. Génération et synchronisation du projet Android via Bun
    - name: Add and Sync Android Platform
      run: |
        bunx cap add android || true
        bunx cap sync android

    # 5. Octroi des permissions d'exécution à Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    # 6. Compilation de l'APK Debug
    - name: Build Debug APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    # 7. Génération de l'Artifact (Téléchargement de l'APK)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PulseEPG-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        
