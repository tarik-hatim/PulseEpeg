name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Installation des dépendances JavaScript & outils Capacitor
    - name: Install Dependencies
      run: |
        bun install
        bun add @capacitor/core @capacitor/cli @capacitor/android

    # 2. Build de l'application Web (Vite)
    - name: Build Web App
      run: bun run build

    # 3. Génération et synchronisation du projet Android via Bun
    - name: Add and Sync Android Platform
      run: |
        bunx cap add android || true
        bunx cap sync android

    # 4. Octroi des permissions d'exécution à Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    # 5. Compilation de l'APK Debug
    - name: Build Debug APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    # 6. Génération de l'Artifact (Téléchargement de l'APK)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PulseEPG-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        
