  <defs>
    <linearGradient id="tvBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#15132d" />
    </linearGradient>
    <radialGradient id="tvBlueGlow" cx="25%" cy="45%" r="55%">
