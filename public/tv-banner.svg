      <stop offset="35%" stop-color="#be123c" />
      <stop offset="70%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="tvHeroCrimson" x1="0%" y1="0%" x2="95%" y2="90%">
