    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0a0e17;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100%;
      }
      #tv-boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0a0e17;
        background-image: radial-gradient(circle at 50% 38%, rgba(0, 85, 255, 0.22) 0%, rgba(10, 14, 23, 0.98) 65%);
        color: #ffffff;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .tv-boot-logo-box {
        width: 80px;
        height: 80px;
        border-radius: 18px;
        background: #060911;
        border: 1.5px solid rgba(225, 29, 72, 0.55);
        box-shadow: 0 0 28px rgba(225, 29, 72, 0.38), 0 0 18px rgba(0, 85, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        overflow: hidden;
      }
      .tv-boot-spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(225, 29, 72, 0.22);
        border-top-color: #e11d48;
        border-right-color: #0055ff;
        animation: tvBootSpin 0.85s linear infinite;
        margin-bottom: 18px;
      }
      .tv-boot-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 0 0 6px 0;
        color: #ffffff;
      }
      .tv-boot-status {
        font-size: 16px;
        font-weight: 600;
        color: #38bdf8;
        margin: 0 0 6px 0;
      }
      .tv-boot-sub {
        font-size: 13px;
        color: #94a3b8;
        max-width: 420px;
        line-height: 1.45;
        margin: 0;
      }
      .tv-boot-retry-btn {
        margin-top: 18px;
        padding: 10px 20px;
        border-radius: 10px;
        border: 2px solid #ffffff;
        background-color: #0055ff;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: none;
      }
      .tv-boot-retry-btn:focus {
        outline: 3px solid #ec4899;
        background-color: #1d4ed8;
      }
      @keyframes tvBootSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#0a0e17] text-[#ffffff] antialiased selection:bg-[#e11d48] selection:text-[#ffffff]">
    <div id="root">
      <!-- Fallback visuel immédiat affiché à 0ms avant l'exécution du moindre script JS (Android TV / Box Echolink Atomo) -->
      <div id="tv-boot-splash" role="status" aria-live="polite">
        <div class="tv-boot-logo-box" aria-hidden="true">
          <svg width="80" height="80" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bootStem" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="30%" stop-color="#0055ff" />
                <stop offset="100%" stop-color="#0f2361" />
              </linearGradient>
              <linearGradient id="bootUnder" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#e11d48" />
                <stop offset="65%" stop-color="#0055ff" />
                <stop offset="100%" stop-color="#172554" />
              </linearGradient>
              <linearGradient id="bootHero" x1="0%" y1="0%" x2="95%" y2="90%">
                <stop offset="0%" stop-color="#ff335c" />
                <stop offset="38%" stop-color="#ff0033" />
                <stop offset="100%" stop-color="#9f1239" />
              </linearGradient>
            </defs>
            <rect width="512" height="512" fill="#060911" />
            <path d="M 128 92 C 128 81, 136 74, 147 74 H 200 C 210 74, 218 81, 218 92 V 430 Q 173 422, 128 438 Z" fill="url(#bootStem)" />
            <path d="M 314 184 H 404 C 404 274, 338 332, 232 332 H 176 V 248 H 232 C 284 248, 314 224, 314 196 Z" fill="url(#bootUnder)" />
            <path d="M 128 148 L 218 112 V 224 L 128 246 Z" fill="#020409" fill-opacity="0.7" />
            <path d="M 128 92 C 128 81, 136 74, 147 74 H 242 C 344 74, 404 126, 404 202 C 404 214, 402 226, 397 238 L 308 198 C 312 191, 314 183, 314 174 C 314 149, 284 134, 232 134 H 206 L 128 168 Z" fill="url(#bootHero)" />
            <path d="M 248 386 H 284 L 302 346 L 326 420 L 348 366 L 362 386 H 398" stroke="#e11d48" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 248 386 H 284 L 302 346 L 326 420 L 348 366 L 362 386 H 398" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="tv-boot-spinner" aria-hidden="true"></div>
        <h1 class="tv-boot-title">PulseEPG</h1>
        <p id="tv-boot-status-text" class="tv-boot-status">Chargement...</p>
        <p id="tv-boot-sub-text" class="tv-boot-sub">Initialisation du Guide TV &amp; compatibilité Android TV</p>
        <button id="tv-boot-retry-btn" type="button" class="tv-boot-retry-btn" onclick="window.__pulseRecoverBoot && window.__pulseRecoverBoot()">
          Réinitialiser &amp; Relancer
        </button>
      </div>
    </div>
    <script>
      (function () {
        try {
          if (typeof window.globalThis === 'undefined') {
            window.globalThis = window;
          }
          // Polyfill sécurisé pour ResizeObserver sur anciens moteurs WebView Android TV
          if (typeof window.ResizeObserver === 'undefined') {
            window.ResizeObserver = function (callback) {
              this.callback = callback;
              this.observe = function () {};
              this.unobserve = function () {};
              this.disconnect = function () {};
            };
          }
          // Polyfill sécurisé pour IntersectionObserver sur anciens moteurs WebView Android TV
          if (typeof window.IntersectionObserver === 'undefined') {
            window.IntersectionObserver = function () {
              this.observe = function () {};
              this.unobserve = function () {};
              this.disconnect = function () {};
            };
          }
          // Polyfill Element.prototype.scrollTo et window.scrollTo pour anciens WebViews qui refusent ScrollToOptions
          var origWinScrollTo = window.scrollTo;
          if (typeof origWinScrollTo === 'function') {
            window.scrollTo = function (a, b) {
              try {
                if (a && typeof a === 'object') {
                  origWinScrollTo.call(window, a.left || 0, a.top || 0);
                } else {
                  origWinScrollTo.call(window, a || 0, b || 0);
                }
              } catch (_e) {}
            };
          }
          if (typeof Element !== 'undefined' && Element.prototype) {
            var origElScrollTo = Element.prototype.scrollTo;
            Element.prototype.scrollTo = function (a, b) {
              try {
                if (a && typeof a === 'object') {
                  if (typeof a.left === 'number') this.scrollLeft = a.left;
                  if (typeof a.top === 'number') this.scrollTop = a.top;
                } else if (typeof origElScrollTo === 'function') {
                  origElScrollTo.call(this, a || 0, b || 0);
                } else {
                  if (typeof a === 'number') this.scrollLeft = a;
                  if (typeof b === 'number') this.scrollTop = b;
                }
              } catch (_e) {}
            };
            var origScrollIntoView = Element.prototype.scrollIntoView;
            if (typeof origScrollIntoView === 'function') {
              Element.prototype.scrollIntoView = function (arg) {
                try {
                  origScrollIntoView.call(this, arg);
                } catch (_e) {
                  try {
                    origScrollIntoView.call(this, false);
                  } catch (_e2) {}
                }
              };
            }
          }
          // Polyfills Array.prototype.flatMap / at / String.prototype.replaceAll / Object.hasOwn pour WebView Chromium < 73
          if (!Array.prototype.flatMap) {
            Array.prototype.flatMap = function (callback, thisArg) {
              var res = [];
              for (var i = 0; i < this.length; i++) {
                if (i in this) {
                  var el = callback.call(thisArg, this[i], i, this);
                  if (Array.isArray(el)) {
                    for (var j = 0; j < el.length; j++) res.push(el[j]);
                  } else {
                    res.push(el);
                  }
                }
              }
              return res;
            };
          }
          if (!String.prototype.replaceAll) {
            String.prototype.replaceAll = function (search, replacement) {
              return this.split(search).join(replacement);
            };
          }
          if (!Object.hasOwn) {
            Object.hasOwn = function (obj, prop) {
              return Object.prototype.hasOwnProperty.call(obj, prop);
            };
          }
          window.__pulseRecoverBoot = function () {
            try {
              if (window.localStorage) {
                window.localStorage.clear();
              }
            } catch (_e) {}
            window.location.reload();
          };
          var showBootRecovery = function (msg) {
            try {
              var statusEl = document.getElementById('tv-boot-status-text');
              var subEl = document.getElementById('tv-boot-sub-text');
              var btnEl = document.getElementById('tv-boot-retry-btn');
              if (statusEl) statusEl.textContent = 'Chargement en mode compatibilité TV...';
              if (subEl && msg) subEl.textContent = String(msg).slice(0, 140);
              if (btnEl) {
                btnEl.style.display = 'inline-block';
                btnEl.focus();
              }
            } catch (_e) {}
          };
          window.addEventListener('error', function (e) {
            var splash = document.getElementById('tv-boot-splash');
            if (splash && e && e.message) {
              showBootRecovery(e.message);
            }
          });
          window.addEventListener('unhandledrejection', function (e) {
            var splash = document.getElementById('tv-boot-splash');
            if (splash && e && e.reason) {
              showBootRecovery(e.reason.message || e.reason);
            }
          });
        } catch (_bootErr) {}
      })();
    </script>
